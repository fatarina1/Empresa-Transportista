server.port=8081
spring.application.name=seguimiento-service
# Swagger UI generará automáticamente desde los controladores
# H2 console (optional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2
# JPA/H2 defaults
spring.jpa.hibernate.ddl-auto=update

# URL del servicio de logística
logistica.service.url=http://localhost:8082

# OAuth2 Resource Server (Keycloak realm)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/tpi-backend
