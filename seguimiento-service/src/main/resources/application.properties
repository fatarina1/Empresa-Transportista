server.port=8081
spring.application.name=seguimiento-service
# Swagger UI generará automáticamente desde los controladores
# H2 console (optional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2
# JPA/H2 defaults
spring.jpa.hibernate.ddl-auto=update

# URL del servicio de logística
# Para Docker: usar nombre del servicio
# Para local: usar localhost:8082
logistica.service.url=${LOGISTICA_URL:http://localhost:8082}
