server.port=8081
spring.application.name=seguimiento-service
# Swagger UI generará automáticamente desde los controladores
# H2 console (optional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2
# JPA/H2 defaults
spring.jpa.hibernate.ddl-auto=update

# URL del servicio de logística
# Para Docker: usar nombre del servicio
# Para local: usar localhost:8082
logistica.service.url=${LOGISTICA_URL:http://localhost:8082}

# ==========================================
# LOGGING CONFIGURATION
# ==========================================
logging.level.root=INFO
logging.level.ar.edu.tpi.seguimiento=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ==========================================
# ACTUATOR CONFIGURATION
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics,loggers,env,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# Application info
info.app.name=Seguimiento Service
info.app.description=Servicio de seguimiento de solicitudes y contenedores
info.app.version=1.0.0
info.app.java.version=${java.version}

# Metrics
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
