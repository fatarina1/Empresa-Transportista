server.port=8081
spring.application.name=seguimiento-service
# Swagger UI generará automáticamente desde los controladores
# H2 console (optional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2
# JPA/H2 defaults
spring.jpa.hibernate.ddl-auto=update

# URL del servicio de logística
# Para Docker: usar nombre del servicio
# Para local: usar localhost:8082
logistica.service.url=${LOGISTICA_URL:http://localhost:8082}

# OAuth2 Resource Server (Keycloak)
# Usamos jwk-set-uri en lugar de issuer-uri para evitar problemas con localhost vs host.docker.internal
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_URI:http://host.docker.internal:8180/realms/tpi-backend/protocol/openid-connect/certs}
