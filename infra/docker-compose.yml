services:
  # Keycloak (identity provider) - exposed for admin UI. Keep credentials in .env in real projects.
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: keycloak
    command: start-dev
    ports:
      - "8180:8080" # host:container (admin UI)
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin123}
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # API Gateway - single entry point exposed to the host
  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    image: tpi/api-gateway:latest
    ports:
      - "8080:8080"  # host:container (ÚNICO PUERTO EXPUESTO AL HOST)
    environment:
      - SPRING_PROFILES_ACTIVE=default
      # JWT validation endpoint
      - KEYCLOAK_JWK_URI=http://host.docker.internal:8180/realms/tpi-backend/protocol/openid-connect/certs
      # URLs internas de microservicios (NO expuestos al host)
      - LOGISTICA_URL=http://logistica-service:8082
      - SEGUIMIENTO_URL=http://seguimiento-service:8081
      - GEOAPI_URL=http://geoapi:8083
    depends_on:
      keycloak:
        condition: service_healthy
      geoapi:
        condition: service_started
      logistica-service:
        condition: service_started
      seguimiento-service:
        condition: service_started
    networks:
      - app-net

  # Seguimiento service - NOT exposed to host (internal only, accesible solo via Gateway)
  seguimiento-service:
    build:
      context: ../seguimiento-service
      dockerfile: Dockerfile
    image: tpi/seguimiento-service:latest
    ports:
      - "8081:8081"  # Expuesto solo para desarrollo (Swagger UI)
    environment:
      - LOG_LEVEL=INFO
      - LOGISTICA_URL=http://logistica-service:8082
      # DataSource: prefer an externally-provided DB via env (SPRING_DATASOURCE_URL),
      # otherwise default to an in-memory H2 for local runs to avoid needing Postgres container
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:h2:mem:testdb}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:-org.h2.Driver}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-sa}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-}
    depends_on:
      logistica-service:
        condition: service_started
    networks:
      - app-net

  # Logistica service - NOT exposed to host (internal only, accesible solo via Gateway)
  logistica-service:
    build:
      context: ../logistica-service
      dockerfile: Dockerfile
    image: tpi/logistica-service:latest
    ports:
      - "8082:8082"  # Expuesto solo para desarrollo (Swagger UI)
    environment:
      - VALOR_LITRO_COMBUSTIBLE=${VALOR_LITRO_COMBUSTIBLE:-450.0}
    depends_on:
      geoapi:
        condition: service_started
    networks:
      - app-net

  # GeoAPI service - NOT exposed to host (internal only, accesible solo via Gateway)
  geoapi:
    build:
      context: ../geoapi
      dockerfile: Dockerfile
    image: tpi/geoapi:latest
    ports:
      - "8083:8083"  # Expuesto solo para desarrollo (Swagger UI)
    environment:
      - GOOGLE_MAPS_APIKEY=${GOOGLE_MAPS_APIKEY}
    networks:
      - app-net


volumes:
  keycloak_data:
  pgdata:

networks:
  app-net:
    driver: bridge
