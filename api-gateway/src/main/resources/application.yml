server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Las rutas ahora se configuran programáticamente en GatewayConfig.java
      # Esto permite mayor flexibilidad y control sobre filtros y predicados
      
      # Configuración CORS global
      globalcors:
        corsConfigurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:4200"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

# Configuración de URLs de microservicios (externalizadas)
api-gateway:
  url-logistica-service: http://localhost:8082
  url-seguimiento-service: http://localhost:8081
  url-geoapi-service: http://localhost:8083

# Configuración de actuator para monitoreo
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
