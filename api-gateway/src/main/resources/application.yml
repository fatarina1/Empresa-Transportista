server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    api-gateway:
      # Las rutas ahora se configuran programáticamente en GatewayConfig.java
      # Esto permite mayor flexibilidad y control sobre filtros y predicados
      
      # Configuración CORS global
      globalcors:
        corsConfigurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:4200"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
  security:
    oauth2:
      resourceserver:
        jwt:
          # Usamos jwk-set-uri en lugar de issuer-uri para evitar validación estricta del issuer
          # El gateway accede a Keycloak usando el nombre del servicio interno de Docker
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://keycloak:8080/realms/tpi-backend/protocol/openid-connect/certs}
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:tpi-backend-client}
            # No usamos client-secret (cliente público)
            authorization-grant-type: authorization_code
            redirect-uri: "${GATEWAY_REDIRECT_URI:http://localhost:8080/api/login/oauth2/code/keycloak}"
            scope: openid,profile,email
        provider:
          keycloak:
            authorization-uri: ${KEYCLOAK_AUTHZ_URI:http://keycloak:8080/realms/tpi-backend/protocol/openid-connect/auth}
            token-uri: ${KEYCLOAK_TOKEN_URI:http://keycloak:8080/realms/tpi-backend/protocol/openid-connect/token}
            jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://keycloak:8080/realms/tpi-backend/protocol/openid-connect/certs}
            user-info-uri: ${KEYCLOAK_USERINFO_URI:http://keycloak:8080/realms/tpi-backend/protocol/openid-connect/userinfo}
            user-name-attribute: preferred_username

# Configuración de URLs de microservicios (externalizadas)
api-gateway:
  url-logistica-service: http://logistica-service:8082
  url-seguimiento-service: http://seguimiento-service:8081
  url-geoapi-service: http://geoapi:8083

# Configuración de actuator para monitoreo
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
