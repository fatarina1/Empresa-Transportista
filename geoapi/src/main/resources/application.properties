server.port=8083
spring.application.name=geoapi

# Google Maps API Configuration
google.maps.api.key=${GOOGLE_MAPS_API_KEY:YOUR_API_KEY_HERE}
google.maps.api.url=https://maps.googleapis.com/maps/api

# Logging
logging.level.utnfc.isi.back.spring.geoapi=INFO

# OAuth2 Resource Server (Keycloak realm)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/tpi-backend
