server.port=8083
spring.application.name=geoapi

# Springdoc OpenAPI (Swagger UI)
springdoc.swagger-ui.path=/swagger-ui.html

# Google Maps API Configuration
# The API key is read from the environment variable `GOOGLE_MAPS_APIKEY`.
# Do NOT store API keys in this file. Example: export GOOGLE_MAPS_APIKEY=your_key

# Logging
logging.level.utnfc.isi.back.spring.geoapi=INFO

# OAuth2 Resource Server (Keycloak realm)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/tpi-backend
