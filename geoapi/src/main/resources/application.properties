server.port=8083
spring.application.name=geoapi

# Springdoc OpenAPI (Swagger UI)
springdoc.swagger-ui.path=/swagger-ui.html

# Google Maps API Configuration
google.maps.apikey=AIzaSyDH5W4sAjFgqLAY3ZUMzZVHD7PjJXbFzD8

# Logging
logging.level.root=INFO
logging.level.utnfc.isi.back.spring.geoapi=DEBUG

# OAuth2 Resource Server (Keycloak realm)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/tpi-backend

# ==========================================
# ACTUATOR CONFIGURATION
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics,loggers,env,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# Application info
info.app.name=GeoAPI Service
info.app.description=Servicio de cálculo de distancias con Google Maps
info.app.version=1.0.0
info.app.java.version=${java.version}

# Metrics
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
