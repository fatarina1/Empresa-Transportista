server.port=8082
spring.application.name=logistica-service
# Swagger UI generará automáticamente desde los controladores
# H2 console (optional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2
# JPA/H2 defaults
spring.jpa.hibernate.ddl-auto=update

# URL del servicio de geoapi (puerto actualizado según documento)
geoapi.service.url=http://localhost:8080

# OAuth2 Resource Server (Keycloak realm)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/tpi-backend
