server.port=8082
spring.application.name=logistica-service

# Swagger UI generará automáticamente desde los controladores

# H2 console (optional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# JPA/H2 defaults
spring.jpa.hibernate.ddl-auto=update

# URL del servicio de geoapi (puerto actualizado)
geoapi.service.url=http://geoapi:8083

# ===================================
# CONFIGURACIÓN DE LOGGING
# ===================================
# Nivel de log general
logging.level.root=INFO
logging.level.ar.edu.tpi.logistica=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Patrón de log para consola (si no se usa logback-spring.xml)
# logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [CID=%X{correlationId}] %logger{36} - %msg%n

# ===================================
# SPRING BOOT ACTUATOR
# ===================================
# Exponer endpoints de monitoreo
management.endpoints.web.exposure.include=health,info,metrics,loggers,env,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# Información de la aplicación
info.app.name=Logistica Service
info.app.description=Microservicio de gestión de rutas y tramos
info.app.version=1.0.0
info.app.java.version=${java.version}

# Métricas personalizadas
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
